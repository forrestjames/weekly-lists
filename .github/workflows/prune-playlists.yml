name: Prune old playlist entries

on:
  schedule:
    - cron: "17 5 1 * *"   # 1st of each month, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be removed"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Remove tracks older than 60 days
        env:
          # Same secret names are assumed as the add-tracks workflow. Rename if yours differ.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          MAX_AGE_DAYS: "60"
          # Scheduled runs are live. Manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python scripts/prune_playlists.py
      - name: Commit archived pick files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A picks
          git diff --cached --quiet || (git commit -m "Archive picks older than 60 days" && git push)
