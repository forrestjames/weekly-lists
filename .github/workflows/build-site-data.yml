name: Build site data

on:
  push:
    branches: [main]
    paths:
      - "picks/rob/*.json"
      - "picks/juno/*.json"
      - "scripts/build_site_data.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest.json and archive.json
        env:
          # Used to look up cover art on Spotify. Optional: without them the
          # data still builds and the page looks covers up in the browser.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/build_site_data.py

      - name: Commit if anything changed
        run: |
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes to site data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update site data"
          git pull --rebase origin main
          git push origin HEAD:main
